name = "llm-integration-backend"
main = "src/index.ts"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat"]

[vars]
OPENAI_MODEL = "gpt-5.6-luna"
FRONTEND_ORIGIN = "http://localhost:5173"

# Set the real secret with: wrangler secret put OPENAI_API_KEY
# Set the real production origin with: wrangler deploy --var FRONTEND_ORIGIN:https://your-frontend.pages.dev
# (or edit the value above once you know your Pages URL/custom domain)
